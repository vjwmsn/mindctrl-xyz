    <head>
    </head>
    <body>
        <div class="left-container container">
            <svg xmlns="http://w3.org" style="flex: 20;">
                <polygon id="leTriangle" points="75,20 130,130 20,130" fill="#262626" stroke="#161616" stroke-width="3" />
                <text x="50" y="50" id="pointAC""></text>
                <text x="50" y="50" id="pointBC"></text>
                <text x="50" y="50" id="lenA"></text>
                <text x="50" y="50" id="lenB"></text>
                <text x="50" y="50" id="lenC"></text>
                <style>
                    text {
                        fill: white;
                    }
                </style>
            </svg>
            <div class="navbar">
                <span class="navbar-element">mindctrl.xyz</span>
                <a href="https://mindctrl.xyz" class="navbar-element hover-button">Homepage</a>
                <button class="navbar-element reset-button" id="resetButton">reset values</button>
            </div>
        </div>
        <div class="right-container container">
            <div class="right-row top">
                <div class="table">
                    <div class="table-column table-column-left" style="flex: 2;">
                        <div class="table-item table-item-top">tan(A/B)</div>
                        <div class="table-item table-item-middle">tan(B/A)</div>
                        <div class="table-item table-item-middle">sin(A/C)</div>
                        <div class="table-item table-item-middle">sin(B/C)</div>
                        <div class="table-item table-item-middle">cos(A/C)</div>
                        <div class="table-item table-item-bottom">cos(B/C)</div>
                    </div>
                    <div class="table-column table-column-right" style="flex: 5;">
                        <div class="table-item table-item-top" id="tanAB">N/A</div>
                        <div class="table-item table-item-middle" id="tanBA">N/A</div>
                        <div class="table-item table-item-middle" id="sinAC">N/A</div>
                        <div class="table-item table-item-middle" id="sinBC">N/A</div>
                        <div class="table-item table-item-middle" id="cosAC">N/A</div>
                        <div class="table-item table-item-bottom" id="cosBC">N/A</div>
                    </div>
                </div>
            </div>
            <div class="right-row btm">
                <div class="table">
                    <div class="table-column table-column-left" style="flex: 2;">
                        <div class="table-item table-item-top">angle A,C</div>
                        <div class="table-item table-item-middle">angle B,C</div>
                        <div class="table-item table-item-middle">length A</div>
                        <div class="table-item table-item-middle">length B</div>
                        <div class="table-item table-item-bottom">length C</div>
                    </div>
                    <div class="table-column table-column-right" style="flex: 5;">
                        <div class="table-item table-item-middle">
                            <div class="table-item table-item-bottom" id="angleAC">N/A</div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="table-item table-item-bottom" id="angleBC">N/A</div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="1" max="25" value="15" class="slider" id="lengthASlider" style="margin: 0px; flex-grow: 1;">
                              <input type="number" id="lengthA" min="0.0001" max="100" style="margin-left: 5px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="1" max="25" value="15" class="slider" id="lengthBSlider" style="margin: 0px; flex-grow: 1;">
                              <input type="number" id="lengthB"min="0.0001" max="100" style="unset: all; margin-left: 10px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-bottom" id="lengthCElement">N/A</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

<script>
let angleACOut = document.getElementById("angleAC")
let angleBCOut = document.getElementById("angleBC")
let tanABOut = document.getElementById("tanAB");
let tanBAOut = document.getElementById("tanBA");
let sinACOut = document.getElementById("sinAC");
let sinBCOut = document.getElementById("sinBC");
let cosACOut = document.getElementById("cosAC");
let cosBCOut = document.getElementById("cosBC");

let resetButton = document.getElementById("resetButton")

let lengthASlider = document.getElementById("lengthASlider")
let lengthBSlider = document.getElementById("lengthBSlider")

let lengthAInput = document.getElementById("lengthA")
let lengthBInput = document.getElementById("lengthB")

let lengthCElement = document.getElementById("lengthCElement")

function Pythagorean(a, b) {return Math.sqrt(a*a + b*b)}

let angleAC = 45
let angleBC = 45
let lengthA = 10
let lengthB = 10
let lengthC = Pythagorean(lengthA, lengthB)

let tanAB = lengthA / lengthB
let tanBA = lengthB / lengthA
let sinAC = lengthA / lengthC
let sinBC = lengthB / lengthC
let cosAC = lengthA / lengthC
let cosBC = lengthB / lengthC

let triangle = document.getElementById("leTriangle")
let pointAC = document.getElementById("pointAC")
let pointBC = document.getElementById("pointBC")
let lenA = document.getElementById("lenA")
let lenB = document.getElementById("lenB")
let lenC = document.getElementById("lenC")

function UpdateValues() {
  lengthA = lengthAInput.value
  lengthB = lengthBInput.value
  lengthC = Pythagorean(lengthA, lengthB).toFixed(4)

  tanAB = (lengthA / lengthB).toFixed(4)
  tanBA = (lengthB / lengthA).toFixed(4)
  sinAC = (lengthA / lengthC).toFixed(4)
  sinBC = (lengthB / lengthC).toFixed(4)
  cosAC = (lengthA / lengthC).toFixed(4)
  cosBC = (lengthB / lengthC).toFixed(4)

  angleAC = (Math.atan2(lengthB, lengthA) * 180 / Math.PI).toFixed(4) + "°"
  angleBC = (Math.atan2(lengthA, lengthB) * 180 / Math.PI).toFixed(4) + "°"

  angleACOut.innerHTML = angleAC
  angleBCOut.innerHTML = angleBC
  tanABOut.innerHTML = tanAB
  tanBAOut.innerHTML = tanBA
  sinACOut.innerHTML = sinAC
  sinBCOut.innerHTML = sinBC
  cosACOut.innerHTML = cosAC
  cosBCOut.innerHTML = cosBC
  lengthCElement.innerHTML = lengthC

  triangle.setAttribute("points", `50,50,${lengthA*20 + 50},50,50,${lengthB*20 + 50}`)
  pointAC.innerHTML = `AC (${angleAC})`
  pointAC.setAttribute("x", `${lengthA*20 + 50}`)
  pointBC.innerHTML = `BC (${angleBC})`
  pointBC.setAttribute("y", `${lengthB*20 + 50}`)

  lenA.innerHTML = `A (${lengthA})`
  lenA.setAttribute("x", `${lengthA*10 + 50}`)
  lenB.innerHTML = `B (${lengthB})`
  lenB.setAttribute("y", `${lengthB*10 + 50}`)
  lenC.innerHTML = `C (${lengthC})`
  lenC.setAttribute("x",`${lengthA*10 + 50}`)
  lenC.setAttribute("y",`${lengthB*10 + 50}`)
}

lengthAInput.value = lengthASlider.value
lengthBInput.value = lengthBSlider.value

lengthASlider.oninput = function() {
  lengthAInput.value = this.value
  UpdateValues()
}
lengthAInput.oninput = function() {
  lengthASlider.value = this.value
  UpdateValues()
}

lengthBSlider.oninput = function() {
  lengthBInput.value = this.value
  UpdateValues()
}
lengthBInput.oninput = function() {
  lengthBSlider.value = this.value
  UpdateValues()
}

resetButton.onclick = function() {
  lengthAInput.value = 15
  lengthBInput.value = 15
  UpdateValues()
}

lengthAInput.value = 15
lengthBInput.value = 15
UpdateValues()

</script>
