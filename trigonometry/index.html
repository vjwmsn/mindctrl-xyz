<html>
    <head>
    </head>
    <body>
        <div class="left-container container">
            <svg xmlns="http://w3.org" style="flex: 20;">
                <polygon id="leTriangle" points="75,20 130,130 20,130" fill="#262626" stroke="#161616" stroke-width="3" />
                <text x="50" y="50" id="pointAC""></text>
                <text x="50" y="50" id="pointBC"></text>
                <text x="50" y="50" id="lenA"></text>
                <text x="50" y="50" id="lenB"></text>
                <text x="50" y="50" id="lenC"></text>
                <style>
                    text {
                        fill: white;
                    }
                </style>
            </svg>
            <div class="navbar">
                <span class="navbar-element">mindctrl.xyz</span>
                <a href="https://mindctrl.xyz" class="navbar-element hover-button">Homepage</a>
                <button class="navbar-element reset-button" id="resetButton">reset values</button>
            </div>
        </div>
        <div class="right-container container">
            <div class="right-row top">
                <div class="table">
                    <div class="table-column table-column-left" style="flex: 2;">
                        <div class="table-item table-item-top">tan AB</div>
                        <div class="table-item table-item-middle">tan BA</div>
                        <div class="table-item table-item-middle">sin AC</div>
                        <div class="table-item table-item-middle">sin BC</div>
                        <div class="table-item table-item-middle">cos AC</div>
                        <div class="table-item table-item-bottom">cos BC</div>
                    </div>
                    <div class="table-column table-column-right" style="flex: 5;">
                        <div class="table-item table-item-top" id="tanAB">N/A</div>
                        <div class="table-item table-item-middle" id="tanBA">N/A</div>
                        <div class="table-item table-item-middle" id="sinAC">N/A</div>
                        <div class="table-item table-item-middle" id="sinBC">N/A</div>
                        <div class="table-item table-item-middle" id="cosAC">N/A</div>
                        <div class="table-item table-item-bottom" id="cosBC">N/A</div>
                    </div>
                </div>
            </div>
            <div class="right-row btm">
                <div class="table">
                    <div class="table-column table-column-left" style="flex: 2;">
                        <div class="table-item table-item-top">angle AC</div>
                        <div class="table-item table-item-middle">angle BC</div>
                        <div class="table-item table-item-middle">length A</div>
                        <div class="table-item table-item-middle">length B</div>
                        <div class="table-item table-item-bottom">length C</div>
                    </div>
                    <div class="table-column table-column-right" style="flex: 5;">
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="0" max="90" value="15" class="slider" id="angleACSlider" style="margin: 0px; margin-left: 10px; flex-grow: 1;">
                              <input type="number" id="angleAC" min="0" max="90" style="margin-left: 10px; margin-right: 10px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="0" max="90" value="15" class="slider" id="angleBCSlider" style="margin: 0px; margin-left: 10px; flex-grow: 1;">
                              <input type="number" id="angleBC" min="0" max="90 " style="margin-left: 10px; margin-right: 10px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="1" max="25" value="15" class="slider" id="lengthASlider" style="margin: 0px; margin-left: 10px; flex-grow: 1;">
                              <input type="number" id="lengthA" min="0.0001" max="100" style="margin-left: 10px; margin-right: 10px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-middle">
                            <div class="slidecontainer">
                              <input type="range" min="1" max="25" value="15" class="slider" id="lengthBSlider" style="margin: 0px; margin-left: 10px; flex-grow: 1;">
                              <input type="number" id="lengthB"min="0.0001" max="100" style="unset: all; margin-left: 10px; margin-right: 10px; color: white; color-scheme: dark; width: 4em;"/>
                            </div>
                        </div>
                        <div class="table-item table-item-bottom" id="lengthCElement">N/A</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

<script>

const $ = id => document.getElementById(id);

const tanABOut = $("tanAB");
const tanBAOut = $("tanBA");
const sinACOut = $("sinAC");
const sinBCOut = $("sinBC");
const cosACOut = $("cosAC");
const cosBCOut = $("cosBC");
const lengthCElement = $("lengthCElement");

const resetButton = $("resetButton");

const lengthASlider = $("lengthASlider");
const lengthBSlider = $("lengthBSlider");
const lengthAInput = $("lengthA");
const lengthBInput = $("lengthB");

const angleACSlider = $("angleACSlider");
const angleBCSlider = $("angleBCSlider");
const angleACInput = $("angleAC");
const angleBCInput = $("angleBC");

const triangle = $("leTriangle");
const pointAC = $("pointAC");
const pointBC = $("pointBC");
const lenA = $("lenA");
const lenB = $("lenB");
const lenC = $("lenC");

let angleAC = 45;
let angleBC = 45;

let lengthA = 15;
let lengthB = 15;
let lengthC = Math.sqrt(lengthA ** 2 + lengthB ** 2);

function Pythagorean(a, b) {
    return Math.sqrt(a * a + b * b);
}

function UpdateValues() {

    const tanAB = lengthA / lengthB;
    const tanBA = lengthB / lengthA;

    const sinAC = lengthB / lengthC;
    const sinBC = lengthA / lengthC;

    const cosAC = lengthA / lengthC;
    const cosBC = lengthB / lengthC;

    tanABOut.textContent = tanAB.toFixed(4);
    tanBAOut.textContent = tanBA.toFixed(4);

    sinACOut.textContent = sinAC.toFixed(4);
    sinBCOut.textContent = sinBC.toFixed(4);

    cosACOut.textContent = cosAC.toFixed(4);
    cosBCOut.textContent = cosBC.toFixed(4);

    lengthCElement.textContent = lengthC.toFixed(4);

    triangle.setAttribute(
        "points",
        `50,50 ${lengthA * 20 + 50},50 50,${lengthB * 20 + 50}`
    );

    pointAC.textContent = `AC (${angleAC.toFixed(2)}°)`;
    pointAC.setAttribute("x", lengthA * 20 + 50);

    pointBC.textContent = `BC (${angleBC.toFixed(2)}°)`;
    pointBC.setAttribute("y", lengthB * 20 + 50);

    lenA.textContent = `A (${lengthA.toFixed(2)})`;
    lenA.setAttribute("x", lengthA * 10 + 50);

    lenB.textContent = `B (${lengthB.toFixed(2)})`;
    lenB.setAttribute("y", lengthB * 10 + 50);

    lenC.textContent = `C (${lengthC.toFixed(4)})`;
    lenC.setAttribute("x", lengthA * 10 + 50);
    lenC.setAttribute("y", lengthB * 10 + 50);
}

function UpdateFromLengths() {

    const a = Number(lengthAInput.value);
    const b = Number(lengthBInput.value);

    if (!Number.isFinite(a) || !Number.isFinite(b) ||
        a <= 0 || b <= 0) return;

    lengthA = a;
    lengthB = b;

    lengthC = Pythagorean(lengthA, lengthB);

    angleAC = Math.atan2(lengthB, lengthA) * 180 / Math.PI;
    angleBC = 90 - angleAC;

    lengthASlider.value = lengthA;
    lengthBSlider.value = lengthB;

    angleACInput.value = angleAC.toFixed(2);
    angleBCInput.value = angleBC.toFixed(2);

    angleACSlider.value = angleAC;
    angleBCSlider.value = angleBC;

    UpdateValues();
}

function UpdateFromAngleAC(degrees) {

    angleAC = Math.max(0.1, Math.min(89.9, Number(degrees)));
    angleBC = 90 - angleAC;

    const radians = angleAC * Math.PI / 180;

    lengthA = lengthC * Math.cos(radians);
    lengthB = lengthC * Math.sin(radians);

    angleACInput.value = angleAC.toFixed(2);
    angleBCInput.value = angleBC.toFixed(2);

    angleACSlider.value = angleAC;
    angleBCSlider.value = angleBC;

    lengthAInput.value = lengthA.toFixed(4);
    lengthBInput.value = lengthB.toFixed(4);

    lengthASlider.value = lengthA;
    lengthBSlider.value = lengthB;

    UpdateValues();
}

lengthASlider.oninput = function() {
    lengthAInput.value = this.value;
    UpdateFromLengths();
};

lengthAInput.oninput = function() {
    UpdateFromLengths();
};

lengthBSlider.oninput = function() {
    lengthBInput.value = this.value;
    UpdateFromLengths();
};

lengthBInput.oninput = function() {
    UpdateFromLengths();
};

angleACSlider.oninput = function() {
    UpdateFromAngleAC(this.value);
};

angleACInput.oninput = function() {
    UpdateFromAngleAC(this.value);
};

angleBCSlider.oninput = function() {
    UpdateFromAngleAC(90 - Number(this.value));
};

angleBCInput.oninput = function() {
    UpdateFromAngleAC(90 - Number(this.value));
};

resetButton.onclick = function() {
    lengthAInput.value = 15;
    lengthBInput.value = 15;

    UpdateFromLengths();
};

lengthAInput.value = 15;
lengthBInput.value = 15;

UpdateFromLengths();

</script>
