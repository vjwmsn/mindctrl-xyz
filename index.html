<head>
    <title>KSP Pause Menu Replica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-image: url(mun_or_bust.png);
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
        }

        .pause-menu-container {
            background: linear-gradient(to bottom, hsl(216, 5%, 35%) 0%, hsl(216, 5%, 25%), hsl(216, 5%, 20%));
            border-radius: 8px;
            padding: 16px 20px 12px 20px;
            width: 320px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 3px 8px rgba(0, 0, 0, 0.8),
                0 0 0 1px #1a1c1e;
        }

        .menu-title {
            text-align: center;
            color: yellowgreen;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px black;
            letter-spacing: 0.5px;
        }

        .subtitle-box {
            background: linear-gradient(to bottom, #232528 0%, #2a2c30 100%);
            border-radius: 4px;
            padding: 6px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow:
                inset 0 1px 2px rgba(0, 0, 0, 0.8),
                0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid #111;
        }

        .subtitle-text {
            color: yellowgreen;
            font-size: 13px;
            font-weight: bold;
            font-style: italic;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-btn {
            background: linear-gradient(to bottom, hsl(216, 5%, 50%) 0%, hsl(216, 5%, 35%), hsl(216, 5%, 25%));
            border: 1px solid black;
            border-radius: 5px;
            padding: 10px 15px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            outline: none;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1),
                0 0.5px 0.5px rgba(0, 0, 0, 0.5);
        }

        .menu-btn:active {
            background: linear-gradient(to bottom, hsl(216, 5%, 35%), hsl(216, 5%, 25%));
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.7),
                0 0 0 rgba(0, 0, 0, 0);
            transform: translateY(1px);
        }

        .quit-btn-container {
            margin-top: 14px;
        }

        .version-info {
            text-align: right;
            margin-top: 12px;
        }

        .version-info-text {
            color: #d0d0d0;
            font-size: 11px;
            font-style: italic;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        .version-info-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="pause-menu-container">

        <h1 class="menu-title">Game Paused</h1>

        <div class="subtitle-box">
            <span class="subtitle-text">@mindctrl</span>
        </div>

        <div class="button-group">
            <a href="https://www.youtube.com/@vjwmsn"><button class="menu-btn">YouTube channel...</button></a>
            <a href="https://www.tiktok.com/@vjwmsn"><button class="menu-btn">TikTok channel...</button></a>
            <a href="https://github.com/vjwmsn/KSP-Crafts"><button class="menu-btn">KSP Craft Files...</button></a>
            <button class="menu-btn">Work in progress...</button>

            <div class="quit-btn-container">
                <a href="https://www.google.com"><button class="menu-btn">Quit to Main Menu</button></a>
            </div>
        </div>

        <div class="version-info">
            <span class="version-info-text">Discord: @vjwmsn</span>
        </div>

    </div>

</body>
